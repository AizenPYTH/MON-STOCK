# Build iOS SANS crédit EAS : la compilation tourne sur une machine macOS de GitHub
# (`eas build --local`, mode officiel d'EAS), puis l'.ipa est envoyé sur TestFlight par
# `eas submit` (l'envoi n'est pas limité par le quota de builds du plan gratuit).
#
# Prérequis (une seule fois) : secret GitHub `EXPO_TOKEN` = jeton d'accès personnel du compte
# Expo propriétaire du projet (expo.dev → Account settings → Access tokens).
# Les certificats iOS et la clé App Store Connect restent stockés sur EAS : rien de sensible dans le dépôt.
#
# Déclenchement : pousser un tag `testflight-*` (ex. testflight-18) ou lancer le workflow à la main.
#
# Durcissement (Q-14 / M-09) :
#   - contrôles (typecheck, lint, Jest, scan du bundle) AVANT toute compilation ou soumission ;
#   - versions figées (Xcode, image macOS, EAS CLI, Node) et actions épinglées par SHA complet ;
#   - jeton GitHub en lecture seule ; l'.ipa n'est PAS publié en artefact (dépôt public), sauf
#     demande explicite au lancement manuel, avec une rétention d'un jour.
# Valeurs figées alignées sur le dernier build réussi (18/10/2026) : image macos-26 (macos-latest),
# Xcode 26.6 (« latest-stable » de l'image 20261013), EAS CLI 25.2.0 (« latest » au 17-18/10, déduit).
name: iOS → TestFlight (build local)

on:
  workflow_dispatch:
    inputs:
      keep_ipa:
        description: "Conserver l'.ipa en artefact 1 jour (dépôt public : visible des comptes GitHub connectés)"
        type: boolean
        default: false
  push:
    tags:
      - "testflight-*"

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  NODE_VERSION: "22.22.0"
  EAS_CLI_VERSION: "25.2.0"
  XCODE_VERSION: "26.6"
  EXPO_NO_TELEMETRY: "1"

jobs:
  checks:
    name: Contrôles mobiles avant build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      # Le code mobile importe src/ (alias @/) : les dépendances racine sont nécessaires.
      - name: Dépendances racine
        run: npm ci
      - name: Dépendances mobiles
        run: npm ci --prefix apps/mobile
      - name: Typecheck, lint, Jest
        run: npm --prefix apps/mobile run check
      - name: Variables publiques du profil EAS production (EXPO_PUBLIC_* uniquement)
        run: |
          node -e '
            const env = require("./apps/mobile/eas.json").build.production.env ?? {};
            for (const [k, v] of Object.entries(env)) {
              if (!/^EXPO_PUBLIC_[A-Z0-9_]+$/.test(k) || /[\r\n]/.test(String(v))) throw new Error("variable refusée : " + k);
              console.log(k + "=" + v);
            }' >> "$GITHUB_ENV"
      - name: Export iOS (JavaScript) et recherche de secrets dans le bundle
        env:
          CI: "1"
        run: npm --prefix apps/mobile run scan:bundle

  ios:
    name: Build iOS (macOS GitHub) puis TestFlight
    needs: checks
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Vérifier le jeton Expo
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN absent : créez un jeton sur expo.dev (Account settings → Access tokens) et ajoutez-le dans GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Xcode (version figée)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: EAS CLI (version figée)
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1 (= v8)
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Dépendances de l'application mobile
        run: npm ci

      - name: Build iOS local (profil production, numéro de build incrémenté sur EAS)
        run: eas build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/MonStock.ipa"

      - name: Conserver l'.ipa (sur demande, 1 jour)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_ipa }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MonStock-ipa
          path: ${{ runner.temp }}/MonStock.ipa
          retention-days: 1
          if-no-files-found: error

      - name: Envoi sur TestFlight
        run: eas submit --platform ios --profile production --path "$RUNNER_TEMP/MonStock.ipa" --non-interactive
