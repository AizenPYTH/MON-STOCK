# Build iOS SANS crédit EAS : la compilation tourne sur une machine macOS de GitHub
# (`eas build --local`, mode officiel d'EAS), puis l'.ipa est envoyé sur TestFlight par
# `eas submit` (l'envoi n'est pas limité par le quota de builds du plan gratuit).
#
# Prérequis (une seule fois) : secret GitHub `EXPO_TOKEN` = jeton d'accès personnel du compte
# Expo propriétaire du projet (expo.dev → Account settings → Access tokens).
# Les certificats iOS et la clé App Store Connect restent stockés sur EAS : rien de sensible dans le dépôt.
#
# Déclenchement : pousser un tag `testflight-*` (ex. testflight-18) ou lancer le workflow à la main.
name: iOS → TestFlight (build local)

on:
  workflow_dispatch:
  push:
    tags:
      - "testflight-*"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  ios:
    name: Build iOS (macOS GitHub) puis TestFlight
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Vérifier le jeton Expo
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN absent : créez un jeton sur expo.dev (Account settings → Access tokens) et ajoutez-le dans GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Xcode stable le plus récent
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Dépendances de l'application mobile
        run: npm ci

      - name: Build iOS local (profil production, numéro de build incrémenté sur EAS)
        run: eas build --platform ios --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/MonStock.ipa"

      - name: Conserver l'.ipa (7 jours)
        uses: actions/upload-artifact@v5
        with:
          name: MonStock-ipa
          path: MonStock.ipa
          retention-days: 7

      - name: Envoi sur TestFlight
        run: eas submit --platform ios --profile production --path "$GITHUB_WORKSPACE/MonStock.ipa" --non-interactive
